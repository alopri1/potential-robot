services:
  - type: web
    name: eurusd-engine-pro
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 90
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CACHE_TTL_SECONDS
        value: "45"
      - key: TWELVEDATA_KEY      # optionnel : source de secours gratuite
        sync: false
      - key: TELEGRAM_BOT_TOKEN  # optionnel : alertes
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: CRON_TOKEN          # optionnel : protège /api/cron
        sync: false
